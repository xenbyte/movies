server {
  listen 80;
  server_name _;
  client_max_body_size 0;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  location = / {
    root /usr/share/nginx/html;
    try_files /index.html =404;
  }

  location /static/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  # Jellyfin ships its own bundled web client under /web/ — block it so the
  # only UI surface is our custom frontend (the JSON/streaming API underneath
  # still needs to stay open below, since our frontend calls it directly).
  location /web/ {
    return 404;
  }

  location / {
    proxy_pass http://jellyfin.movies.svc.cluster.local:80;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
